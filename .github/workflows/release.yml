name: Release

# Cuts a GitHub Release with a self-contained, single-file, ReadyToRun win-x64 build attached as
# a downloadable zip. Runs automatically when a "v*.*.*" tag is pushed, or manually via the
# Actions tab (Run workflow) against any branch — useful for producing a build without cutting an
# official version tag.
#
# Code signing (SignPath): if the SIGNPATH_API_TOKEN secret is set, the built exe is submitted to
# SignPath for signing before it's zipped, so the release download isn't flagged as "Unknown
# Publisher" by Windows SmartScreen. Until those secrets/vars are configured (see README), the
# signing steps are skipped and the release ships unsigned — the workflow still succeeds either
# way. Required repo settings (Settings → Secrets and variables → Actions):
#   Secrets:   SIGNPATH_API_TOKEN, SIGNPATH_ORG_ID
#   Variables: SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: |
          dotnet restore src/FileViewer.Core/FileViewer.Core.csproj
          dotnet restore tests/FileViewer.Core.Tests/FileViewer.Core.Tests.csproj

      - name: Test before releasing
        run: dotnet test tests/FileViewer.Core.Tests/FileViewer.Core.Tests.csproj -c Release --no-restore

      - name: Publish (unsigned)
        run: dotnet publish src/FileViewer.App -c Release -r win-x64 -o publish/FileViewer-win-x64

      - name: Upload unsigned executable for signing
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: publish/FileViewer-win-x64/FileViewer.App.exe
          retention-days: 5

      - name: Submit signing request to SignPath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.SIGNPATH_ORG_ID }}"
          project-slug: "${{ vars.SIGNPATH_PROJECT_SLUG }}"
          signing-policy-slug: "${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}"
          github-artifact-id: "${{ steps.upload_unsigned.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace unsigned exe with the signed one
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item -Force "signed/FileViewer.App.exe" "publish/FileViewer-win-x64/FileViewer.App.exe"

      - name: Zip release build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "publish/FileViewer-win-x64/*" -DestinationPath "release/FileViewer-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Bloomberg File Viewer ${{ steps.tag.outputs.tag }}
          files: release/FileViewer-win-x64.zip
          generate_release_notes: true
